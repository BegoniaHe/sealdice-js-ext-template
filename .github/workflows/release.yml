name: Release SealDice Extension

on:
  workflow_dispatch:
    inputs:
      target:
        description: Registered SealDice API profile represented by this release
        required: true
        default: compat-1.5.x
        type: string
      format:
        description: Release artifact format; sealpack requires an exact 1.6+ target
        required: true
        default: js
        type: choice
        options:
          - js
          - sealpack
          - both
      tag:
        description: GitHub release tag, for example v1.2.3
        required: true
        type: string
      draft:
        description: Create the release as a draft
        required: true
        default: true
        type: boolean

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 26.5.0
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
      - run: npm install --global npm@12.0.1
      - run: npm ci
      - name: Fetch exact core revisions for runtime profiles
        run: |
          node -e '
          const { sealDice } = require("./seal.config.json");
          for (const profile of sealDice.profiles)
            if (profile.kind === "exact") console.log(profile.runtimeCoreCommit);
          ' | xargs git -C reference/sealdice-core fetch --no-tags --depth 1 origin
      - name: Verify release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          expected_tag="v$(node -p \"require('./extension.json').version\")"
          if [ "$TAG" != "$expected_tag" ]; then
            echo "Release tag must be $expected_tag, received $TAG" >&2
            exit 2
          fi
      - name: Build and package
        env:
          FORMAT: ${{ inputs.format }}
          TARGET: ${{ inputs.target }}
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          ./sealw package --format "$FORMAT" --target "$TARGET"
      - name: Attest release artifact
        uses: actions/attest@v4
        with:
          subject-path: release/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          DRAFT: ${{ inputs.draft }}
        run: |
          draft_flag=""
          if [ "$DRAFT" = "true" ]; then draft_flag="--draft"; fi
          gh release create "$TAG" $draft_flag \
            --title "$TAG" \
            release/*
