name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26.5.0
          cache: npm

      - run: npm install --global npm@12.0.1
      - run: npm ci
      - run: ./sealw check --all-targets

  runtime:
    name: Verify bundles in SealDice goja
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 26.5.0
          cache: npm

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - run: npm install --global npm@12.0.1
      - run: npm ci
      - name: Fetch exact core revisions for runtime profiles
        run: |
          node -e '
          const { sealDice } = require("./seal.config.json");
          for (const profile of sealDice.profiles)
            if (profile.kind === "exact") console.log(profile.runtimeCoreCommit);
          ' | xargs git -C reference/sealdice-core fetch --no-tags --depth 1 origin
      - run: ./sealw runtime test --all-targets
